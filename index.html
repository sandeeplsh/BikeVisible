
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d90000">
  <meta name="description"
        content="BikeVisible rear visibility screen for cyclists">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>BikeVisible</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #101010;
      color: white;
      font-family: system-ui, sans-serif;
    }

    body { min-height: 100svh; }

    button {
      font: inherit;
      font-weight: 800;
      border: 0;
      border-radius: 16px;
      min-height: 60px;
      padding: 16px 22px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .home {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      text-align: center;
    }

    .logo {
      font-size: clamp(2.2rem, 10vw, 4rem);
      font-weight: 950;
    }

    .note {
      max-width: 32rem;
      color: #ddd;
      line-height: 1.6;
    }

    #start {
      width: min(100%, 28rem);
      color: white;
      background: #d90000;
    }

    #ride {
      display: none;
      min-height: 100svh;
      width: 100%;
      background: #e60000;
      color: white;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      padding: 20px;
      text-align: center;
    }

    #ride.active { display: flex; }

    .rear-mark {
      font-size: clamp(2.8rem, 14vw, 6rem);
      font-weight: 1000;
      letter-spacing: .06em;
      line-height: 1;
    }

    .rear-sub { font-size: 1.25rem; font-weight: 800; }

    #stop {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 18px;
      width: calc(100% - 36px);
      background: white;
      color: #111;
    }

    #status { font-size: .85rem; }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <main id="home" class="home">
    <div class="logo">
      BIKE<span style="color:#ff3434">VISIBLE</span>
    </div>

    <div class="note">
      A simple rear-facing visibility screen for your bicycle.
    </div>

    <button id="start">START VISIBILITY MODE</button>

    <div class="note">
      Start while stationary. Use a secure mount facing backward.
      This display does not replace a proper bicycle tail light.
    </div>
  </main>

  <section id="ride" aria-label="Rear visibility screen">
    <div class="rear-mark">BIKE</div>
    <div class="rear-mark">VISIBLE</div>
    <div class="rear-sub">CYCLIST AHEAD</div>
    <div id="status" role="status">Visibility mode active</div>
    <button id="stop">STOP / EXIT</button>
  </section>

  <script>
    const home = document.getElementById("home");
    const ride = document.getElementById("ride");
    const start = document.getElementById("start");
    const stop = document.getElementById("stop");
    const status = document.getElementById("status");

    let wakeLock = null;

    async function keepScreenAwake() {
      if (!("wakeLock" in navigator)) {
        status.textContent =
          "Display active. Your phone may dim automatically.";
        return;
      }

      try {
        wakeLock = await navigator.wakeLock.request("screen");
        status.textContent = "Visibility mode active · screen awake";

        wakeLock.addEventListener("release", () => {
          if (ride.classList.contains("active")) {
            status.textContent =
              "Screen-awake request released by the device.";
          }
        });
      } catch (error) {
        status.textContent =
          "Display active. Your phone may dim or lock.";
      }
    }

    start.addEventListener("click", async () => {
      home.classList.add("hidden");
      ride.classList.add("active");
      document.body.style.background = "#e60000";
      await keepScreenAwake();
    });

    stop.addEventListener("click", async () => {
      ride.classList.remove("active");
      home.classList.remove("hidden");
      document.body.style.background = "#101010";

      if (wakeLock) {
        try {
          await wakeLock.release();
        } catch (error) {}
        wakeLock = null;
      }
    });

    document.addEventListener("visibilitychange", async () => {
      if (
        document.visibilityState === "visible" &&
        ride.classList.contains("active")
      ) {
        await keepScreenAwake();
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
